name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r generator/requirements.txt
      - run: python -m pytest -q generator/tests
      # One real puzzle end to end, so a broken generator shows up before it reaches main.
      - run: python generator/generate.py --out "$RUNNER_TEMP/puzzles" --start "$(date -u +%F)" --days 1
      # The same for Night Lights, against the live NASA GIBS imagery.
      - run: python generator/generate_night_lights.py --out "$RUNNER_TEMP/night-lights" --start "$(date -u +%F)" --days 1
      - uses: actions/upload-artifact@v4
        with:
          name: night-lights-sample
          path: ${{ runner.temp }}/night-lights
          retention-days: 7
      # The same for Spike, against the live Wikimedia APIs.
      - run: python generator/generate_spike.py --out "$RUNNER_TEMP/spike" --start "$(date -u +%F)" --days 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
